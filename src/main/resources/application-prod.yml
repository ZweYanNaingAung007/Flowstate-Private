spring:
  application:
    name: flowstate

  #H2 Db Configuration
  datasource:
    url: jdbc:h2:mem:flowstatedb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  #JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Custom application properties
app:
  name: Flowstate
  version: 1.0.0
  max-tasks-per-page: 10
